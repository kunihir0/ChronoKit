name: Inject IPA

on:
  workflow_dispatch:
    inputs:
      chronokit_version:
        description: 'ChronoKit version/tag to inject (e.g., 0.0.10 or v0.0.10)'
        required: true
        type: string
      publish_ipa:
        description: 'Publish IPA to GitHub Release (Use with extreme caution)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inject:
    name: Inject IPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          
      - name: Install pipx and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip
          python -m pip install --upgrade pip
          pip install pipx

      - name: Fetch Release Package
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.chronokit_version }}
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format ($INPUT_VERSION)."
            exit 1
          fi

          if [[ ! "$INPUT_VERSION" == v* ]]; then
            TAG="v$INPUT_VERSION"
          else
            TAG="$INPUT_VERSION"
          fi
          
          echo "Fetching release $TAG..."
          gh release download "$TAG" --pattern "*rootless*.deb" -D dl
          DEB_FILE=$(ls dl/*rootless*.deb | head -n 1)
          
          if [[ -z "$DEB_FILE" ]]; then
            echo "Error: Could not find rootless package for release $TAG"
            exit 1
          fi
          
          cp "$DEB_FILE" "chronokit_inject.deb"
          echo "Downloaded tweak package successfully."

      - name: Run Injection Script
        env:
          TIKTOK_IPA_URL: ${{ secrets.TIKTOK_IPA_URL }}
          TIKTOK_IPA_SHA256: ${{ secrets.TIKTOK_IPA_SHA256 }}
        run: |
          ./scripts/build-ipa.sh "chronokit_inject.deb"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Injected_IPA
          path: TikTok_*_ChronoKit_*.ipa
          retention-days: 1

  publish:
    name: Publish IPA
    runs-on: ubuntu-latest
    needs: inject
    if: inputs.publish_ipa == true
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download IPA Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Injected_IPA
          path: dl/

      - name: Publish IPA to Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.chronokit_version }}
        run: |
          if [[ ! "$INPUT_VERSION" == v* ]]; then
            TAG="v$INPUT_VERSION"
          else
            TAG="$INPUT_VERSION"
          fi
          
          IPA_FILE=$(ls dl/TikTok_*_ChronoKit_*.ipa | head -n 1)
          echo "Uploading $IPA_FILE to release $TAG..."
          gh release upload "$TAG" "$IPA_FILE" --clobber
          echo "Uploaded successfully."
