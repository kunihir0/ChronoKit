name: CI

on:
  push:
    branches:
      - main
      - 'ci/*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate (${{ matrix.scheme }})
    runs-on: macos-latest
    strategy:
      matrix:
        scheme: [rootless, roothide]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Setup Theos (Rootless)
        if: matrix.scheme == 'rootless'
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          cd ~/theos && git checkout 5280bd038207e14f8bd76f5417aa2fe641c03228
          echo "THEOS=~/theos" >> $GITHUB_ENV
          brew install ldid xz dpkg

      - name: Setup Theos (RootHide)
        if: matrix.scheme == 'roothide'
        run: |
          git clone --recursive https://github.com/roothide/theos.git ~/theos
          cd ~/theos && git checkout 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          echo "THEOS=~/theos" >> $GITHUB_ENV
          brew install ldid xz dpkg

      - name: Setup SDKs
        run: |
          curl -LO https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C ~/theos/sdks
          rm iPhoneOS16.5.sdk.tar.xz

      - name: Build Package
        run: |
          ./scripts/build-package.sh ${{ matrix.scheme }}

      - name: Validate Package
        run: |
          DEB_FILE=$(find packages -name "*.deb" | head -n 1)
          ./scripts/validate-package.sh "$DEB_FILE" ${{ matrix.scheme }}

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronokit-${{ matrix.scheme }}
          path: packages/*.deb
          if-no-files-found: error