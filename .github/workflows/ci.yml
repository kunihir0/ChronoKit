name: CI

on:
  push:
    branches:
      - main
      - 'ci/*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate (${{ matrix.scheme }})
    runs-on: macos-latest
    strategy:
      matrix:
        scheme: [rootless, roothide]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos (Rootless)
        if: matrix.scheme == 'rootless'
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Setup Theos (RootHide)
        if: matrix.scheme == 'roothide'
        run: |
          git clone --recursive https://github.com/roothide/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV
          brew install ldid xz

      - name: Setup SDKs
        run: |
          curl -LO https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS15.4.sdk.tar.xz
          tar -xf iPhoneOS15.4.sdk.tar.xz -C ~/theos/sdks
          rm iPhoneOS15.4.sdk.tar.xz

      - name: Build Package
        run: |
          ./scripts/build-package.sh ${{ matrix.scheme }}

      - name: Validate Package
        run: |
          DEB_FILE=$(find packages -name "*.deb" | head -n 1)
          ./scripts/validate-package.sh "$DEB_FILE" ${{ matrix.scheme }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chronokit-${{ matrix.scheme }}
          path: packages/*.deb
          if-no-files-found: error
