name: Release

on:
  push:
    branches:
      - 'ci/production-distribution'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release and deploy Pages'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_release:
    name: Build and validate release
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Verify release version
        id: version
        run: |
          CONTROL_VERSION=$(awk '/^Version:/ {print $2}' control | tr -d '\r')
          if [[ ! "$CONTROL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: control Version is not semantic version format."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: release tag is not vX.Y.Z format."
              exit 1
            fi
            if [[ "${GITHUB_REF_NAME#v}" != "$CONTROL_VERSION" ]]; then
              echo "Error: tag does not match control Version."
              exit 1
            fi
          fi

          echo "VERSION=$CONTROL_VERSION" >> "$GITHUB_ENV"
          echo "version=$CONTROL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install packaging tools
        run: brew install ldid xz dpkg

      - name: Setup pinned Rootless Theos and SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git -C "$HOME/theos" checkout 5280bd038207e14f8bd76f5417aa2fe641c03228
          ./scripts/setup-sdk.sh "$HOME/theos"

      - name: Build and validate Rootless package
        run: |
          rm -rf packages release-bundle apt_repo
          mkdir -p release-bundle
          export THEOS="$HOME/theos"
          ./scripts/build-package.sh rootless

          shopt -s nullglob
          packages_found=(packages/*_iphoneos-arm64.deb)
          if [[ ${#packages_found[@]} -ne 1 ]]; then
            echo "Error: expected exactly one Rootless production package, found ${#packages_found[@]}."
            exit 1
          fi
          ROOTLESS_DEB="${packages_found[0]}"
          ./scripts/validate-package.sh "$ROOTLESS_DEB" rootless
          cp "$ROOTLESS_DEB" "release-bundle/ChronoKit_${VERSION}_rootless_iphoneos-arm64.deb"

      - name: Setup pinned RootHide Theos and SDK
        run: |
          rm -rf "$HOME/theos"
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          git -C "$HOME/theos" checkout 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          ./scripts/setup-sdk.sh "$HOME/theos"

      - name: Build and validate RootHide package
        run: |
          rm -rf packages
          export THEOS="$HOME/theos"
          ./scripts/build-package.sh roothide

          shopt -s nullglob
          packages_found=(packages/*_iphoneos-arm64e.deb)
          if [[ ${#packages_found[@]} -ne 1 ]]; then
            echo "Error: expected exactly one RootHide production package, found ${#packages_found[@]}."
            exit 1
          fi
          ROOTHIDE_DEB="${packages_found[0]}"
          ./scripts/validate-package.sh "$ROOTHIDE_DEB" roothide
          cp "$ROOTHIDE_DEB" "release-bundle/ChronoKit_${VERSION}_roothide_iphoneos-arm64e.deb"

      - name: Generate release checksums and APT repository
        run: |
          (
            cd release-bundle
            shasum -a 256 \
              "ChronoKit_${VERSION}_rootless_iphoneos-arm64.deb" \
              "ChronoKit_${VERSION}_roothide_iphoneos-arm64e.deb" \
              > SHA256SUMS
          )
          ./scripts/build-apt-repo.sh release-bundle

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: release-bundle/
          if-no-files-found: error
          retention-days: 3

      - name: Upload APT repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apt-repository
          path: apt_repo/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish release and deploy Pages
    needs: build_release
    if: github.ref_type == 'tag' || inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate publication ref
        env:
          VERSION: ${{ needs.build_release.outputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Error: publication requires a tag ref."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Error: publication tag does not match control Version."
            exit 1
          fi

      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: release-bundle/

      - name: Download APT repository
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apt-repository
          path: apt_repo/

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apt_repo/

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build_release.outputs.version }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "ChronoKit v$VERSION" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "release-bundle/ChronoKit_${VERSION}_rootless_iphoneos-arm64.deb" \
            "release-bundle/ChronoKit_${VERSION}_roothide_iphoneos-arm64e.deb" \
            release-bundle/SHA256SUMS \
            --clobber
