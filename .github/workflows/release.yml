name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release (false for dry-run)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  build_release:
    name: Build & Publish Release
    runs-on: macos-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Verify Tag Matches Control Version
        run: |
          CONTROL_VERSION=$(awk '/^Version:/ {print $2}' control | tr -d '\r')
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "$CONTROL_VERSION" != "$TAG_VERSION" ]]; then
              echo "Error: Tag version ($TAG_VERSION) does not match control version ($CONTROL_VERSION)!"
              exit 1
            fi
          fi
          echo "VERSION=$CONTROL_VERSION" >> $GITHUB_ENV

      - name: Setup Theos (Rootless)
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          cd ~/theos && git checkout 5280bd038207e14f8bd76f5417aa2fe641c03228
          
      - name: Setup SDKs
        run: |
          curl -LO https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C ~/theos/sdks
          rm iPhoneOS16.5.sdk.tar.xz

      - name: Build Rootless
        run: |
          export THEOS=~/theos
          ./scripts/build-package.sh rootless
          ROOTLESS_DEB=$(find packages -name "*.deb" -type f ! -name "*debug*" | head -n 1)
          ./scripts/validate-package.sh "$ROOTLESS_DEB" rootless
          cp "$ROOTLESS_DEB" "ChronoKit_${VERSION}_rootless_iphoneos-arm64.deb"

      - name: Build RootHide
        run: |
          rm -rf ~/theos
          git clone --recursive https://github.com/roothide/theos.git ~/theos
          cd ~/theos && git checkout 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          brew install ldid xz
          curl -LO https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C ~/theos/sdks
          rm iPhoneOS16.5.sdk.tar.xz

          export THEOS=~/theos
          ./scripts/build-package.sh roothide
          ROOTHIDE_DEB=$(find packages -name "*.deb" -type f ! -name "*debug*" | head -n 1)
          ./scripts/validate-package.sh "$ROOTHIDE_DEB" roothide
          cp "$ROOTHIDE_DEB" "ChronoKit_${VERSION}_roothide_iphoneos-arm64e.deb"

      - name: Generate SHA256SUMS
        run: |
          sha256sum ChronoKit_${VERSION}_rootless_iphoneos-arm64.deb > SHA256SUMS
          sha256sum ChronoKit_${VERSION}_roothide_iphoneos-arm64e.deb >> SHA256SUMS
          cat SHA256SUMS

      - name: Build APT Repository
        run: |
          ./scripts/build-apt-repo.sh

      - name: Setup Pages
        if: github.event_name == 'push' || inputs.publish == true
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages Artifact
        if: github.event_name == 'push' || inputs.publish == true
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: 'apt_repo'

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name == 'push' || inputs.publish == true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish == true
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ChronoKit_${{ env.VERSION }}_rootless_iphoneos-arm64.deb
            ChronoKit_${{ env.VERSION }}_roothide_iphoneos-arm64e.deb
            SHA256SUMS
          name: ChronoKit v${{ env.VERSION }}
          generate_release_notes: true
